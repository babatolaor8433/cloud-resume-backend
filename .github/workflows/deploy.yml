name: deploy-site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Publish resume
        run: |
          aws s3 cp index.html s3://babatolaor8433/index.html --content-type text/html
          aws cloudfront create-invalidation --distribution-id E1Y7QCPQJEEA3S --paths / /index.html